name: Compléter les colonnes de la base Ameli
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/complete-ameli-columns.yml
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Récupérer la base complète
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        lfs: true
    - name: Compléter et vérifier les colonnes
      run: "python - <<'PY'\nimport hashlib\nimport os\nimport re\nimport sqlite3\nimport tempfile\nimport urllib.request\n\
        import xml.etree.ElementTree as ET\nfrom itertools import zip_longest\nfrom pathlib import Path\nfrom zipfile import\
        \ ZipFile\n\n\ndef digest(path):\n    with path.open('rb') as stream:\n        return hashlib.file_digest(stream,\
        \ 'sha256').hexdigest()\n\n\ndef columns(connection, table):\n    return [row[1] for row in connection.execute(f'PRAGMA\
        \ table_info(\"{table}\")')]\n\n\ndatabase = Path('dabase.db')\nassert digest(database) == 'b9a7d8091fd1ca57cade778dbd833a36100b6d8a5b4c4ba77501d83dc0bc19cb',\
        \ 'La base cible a changé.'\nwith tempfile.TemporaryDirectory(dir='.') as directory:\n    temporary = Path(directory)\n\
        \    archive = Path(os.environ['AMELI_SOURCE_ARCHIVE']) if 'AMELI_SOURCE_ARCHIVE' in os.environ else temporary / 'source.zip'\n\
        \    if 'AMELI_SOURCE_ARCHIVE' not in os.environ:\n        urllib.request.urlretrieve('https://raw.githubusercontent.com/Kajan94/site-amelie/9ad37d468f2a00034216dc32257071bb3864f43f/site-amelie.zip',\
        \ archive)\n    with ZipFile(archive) as source_archive:\n        source_data = source_archive.read('SAE 1.01/model/data/debase_db.sqllite3')\n\
        \    prepared = temporary / 'complete.db'\n    prepared.write_bytes(source_data)\n    del source_data\n    assert\
        \ digest(prepared) == 'f8062b14ef3d09e0b06fd281ddb2cf7b7315e683f0902522b9362c4327d3634d', 'La base source ne correspond\
        \ pas à la version vérifiée.'\n    original = sqlite3.connect(database.resolve().as_uri() + '?mode=ro', uri=True)\n\
        \    enriched = sqlite3.connect(prepared)\n    enriched.execute('PRAGMA foreign_keys = ON')\n    with enriched:\n\
        \        assert enriched.execute('UPDATE Departements SET Id_Region = 99 WHERE Num_Departement = 999 AND Id_Region\
        \ = 999').rowcount == 1\n    tables = [row[0] for row in original.execute(\"SELECT name FROM sqlite_master WHERE type\
        \ = 'table' ORDER BY name\")]\n    assert tables == [row[0] for row in enriched.execute(\"SELECT name FROM sqlite_master\
        \ WHERE type = 'table' ORDER BY name\")]\n    additions = {'Demographie': {'vision_generale_all'}, 'Honoraires': {'vision_honoraires_remunerations_niveau_2'}}\n\
        \    for table in tables:\n        common = columns(original, table)\n        new_columns = columns(enriched, table)\n\
        \        assert set(new_columns) - set(common) == additions.get(table, set()), table\n        assert set(common) <=\
        \ set(new_columns), table\n        primary = next(row[1] for row in original.execute(f'PRAGMA table_info(\"{table}\"\
        )') if row[5])\n        query = 'SELECT ' + ', '.join('\"' + name + '\"' for name in common) + f' FROM \"{table}\"\
        \ ORDER BY \"{primary}\"'\n        sentinel = object()\n        for old_row, new_row in zip_longest(original.execute(query),\
        \ enriched.execute(query), fillvalue=sentinel):\n            assert old_row == new_row, f'Données communes différentes\
        \ : {table}'\n        for name in additions.get(table, set()):\n            assert enriched.execute(f'SELECT COUNT(*)\
        \ FROM \"{table}\" WHERE \"{name}\" IS NULL OR \"{name}\" NOT IN (\\'oui\\', \\'non\\')').fetchone()[0] == 0\n   \
        \     print(f'{table} : toutes les données communes conservées.')\n    actual_model = {table: [] for table in tables}\n\
        \    current = None\n    types = {'INTEGER', 'TEXT', 'ANY', 'VARCHAR', 'REAL', 'INT'}\n    for item in ET.parse('modele-relationnel.svg').getroot():\n\
        \        if item.tag.rsplit('}', 1)[-1] != 'text':\n            continue\n        text = ''.join(item.itertext()).strip()\n\
        \        if text in actual_model:\n            current = text\n        elif current and item.attrib.get('font-size')\
        \ == '20' and text not in types:\n            actual_model[current].append(text)\n    assert actual_model == {table:\
        \ columns(enriched, table) for table in tables}, 'Le modèle ne correspond pas aux colonnes de la base.'\n    assert\
        \ enriched.execute('PRAGMA integrity_check').fetchall() == [('ok',)]\n    assert enriched.execute('PRAGMA foreign_key_check').fetchall()\
        \ == []\n    queries = re.findall(r'```sql\\n(.*?)```', Path('README.md').read_text(), re.S)\n    assert len(queries)\
        \ == 4\n    for query in queries:\n        assert original.execute(query).fetchall() == enriched.execute(query).fetchall()\n\
        \    assert enriched.execute('SELECT Id_Region FROM Departements WHERE Num_Departement = 999').fetchone() == (99,)\n\
        \    original.close()\n    enriched.close()\n    prepared.replace(database)\nprint('Base conforme au modèle ; colonnes\
        \ remplies ; intégrité, clés étrangères et requêtes validées.')\n\nPY\n"
    - name: Publier la base vérifiée
      run: 'git config user.name "github-actions[bot]"

        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git add dabase.db

        git commit -m "Aligner les colonnes de la base avec le modèle relationnel"

        git lfs push origin HEAD

        git push origin HEAD:main

        '
